<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donya Khoshrou | Biotech & Research Chronicle</title>

  <!-- Dark Academia Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Academic & Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #111215;
      --navy-card: #181c24;
      --navy-card-hover: #1e232e;
      --border-parchment: #2d3340;
      --text-main: #ebe6dd;
      --text-muted: #9c978f;
      --zereshki: #7e2437;
      --zereshki-glow: #9e2e46;
      --brown-leather: #8a6c52;
      --font-heading: 'Cinzel', serif;
      --font-body: 'EB Garamond', serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1.15rem;
      line-height: 1.7;
      padding: 40px 20px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Top Emblem / Navigation Bar */
    .folio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 25px;
      border-bottom: 1px solid var(--border-parchment);
      margin-bottom: 50px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .folio-tag {
      color: var(--brown-leather);
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 20px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--text-main);
      border-bottom: 1px solid var(--zereshki);
    }

    /* Hero Archive Section */
    .hero-archive {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 40px;
      align-items: center;
      margin-bottom: 60px;
    }

    .hero-archive h1 {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero-archive .sub-chronicle {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--zereshki-glow);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .hero-bio {
      color: var(--text-muted);
      font-size: 1.2rem;
      font-style: italic;
      margin-bottom: 25px;
    }

    .portrait-frame {
      position: relative;
      width: 170px;
      height: 220px;
      border: 1px solid var(--brown-leather);
      padding: 6px;
      background: var(--navy-card);
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(35%) contrast(105%);
      transition: filter 0.4s ease;
    }

    .portrait-frame:hover img {
      filter: grayscale(0%) contrast(100%);
    }

    /* Links & Seals */
    .links-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-archive {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--zereshki);
      color: var(--text-main);
      padding: 7px 18px;
      border-radius: 2px;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      transition: background 0.3s;
      border: 1px solid var(--zereshki-glow);
    }

    .btn-archive:hover {
      background: var(--zereshki-glow);
    }

    .social-glyph {
      color: var(--text-muted);
      font-size: 1.15rem;
      padding: 6px;
      transition: color 0.2s;
      text-decoration: none;
    }

    .social-glyph:hover {
      color: var(--text-main);
    }

    @media (max-width: 700px) {
      .hero-archive {
        grid-template-columns: 1fr;
      }
      .portrait-frame {
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    
    <!-- Header / Identification -->
    <header class="folio-header">
      <div class="folio-tag">FOLIO // ARCHIVE 01</div>
      <nav class="nav-links">
        <a href="#research">Research</a>
        <a href="#curriculum">Chronicle</a>
        <a href="#laboratory">Laboratory</a>
      </nav>
    </header>

    <!-- Hero Profile Section -->
    <section class="hero-archive">
      <div class="hero-text">
        <h1>Donya Khoshrou</h1>
        <div class="sub-chronicle">Medical Biotechnology // Università di Bologna</div>
        <p class="hero-bio">
          Exploring cellular pathways, molecular therapeutics, and regenerative mechanisms. A scientific journal bridging clinical biotechnology with empirical research.
        </p>

        <div class="links-bar">
          <a href="https://drive.google.com/file/d/1oi6k385bmQ1DdQBFnvXoxLNYauh6sUzI/view?usp=sharing" target="_blank" class="btn-archive">
            <i class="fas fa-scroll"></i> Curriculum Vitae
          </a>
          <a href="mailto:donya.khoshrou@studio.unibo.it" class="social-glyph" title="Institutional Mail">
            <i class="fas fa-envelope"></i>
          </a>
          <a href="http://linkedin.com/in/donya-khoshrou" target="_blank" class="social-glyph" title="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="https://t.me/khoshrouu" target="_blank" class="social-glyph" title="Telegram">
            <i class="fab fa-telegram-plane"></i>
          </a>
        </div>
      </div>

      <div class="portrait-frame">
        <img src="./assets/images/donya4.jpg" alt="Donya Khoshrou" />
      </div>
    </section>

  </div>
</body>
</html>
